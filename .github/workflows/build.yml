name: Build DOOR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [room-updated]

permissions:
  contents: read

env:
  CAPNP_SKIP_CHECK: 1
  CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}

jobs:

  # ============================================================
  # Public build without CommonDB (no secrets required)
  # ============================================================

  build-linux-no-room:
    name: build-linux-no-room
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Configure (qmake, no ROOM)
        run: |
          mkdir -p build
          cd build
          qmake ../door.pro

      - name: Build
        run: |
          cd build
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j"$(nproc)"

      - name: Verify LIBMAN_NO_ROOM build
        run: |
          test -f build/door

  # ============================================================
  # Linux build (stage 1)
  # ============================================================

  build-linux:
    name: build-ubuntu
    runs-on: ubuntu-24.04
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Configure (qmake)
        run: |
          mkdir -p build
          cd build
          qmake ../door.pro

      - name: Build
        run: |
          cd build
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j1 room_fetch
          make -j"$(nproc)"

      - name: Package Linux bundle (tar.gz)
        run: |
          set -e
          rm -rf dist
          mkdir -p dist

          BIN=""
          for p in build/door build/Door build/release/door build/release/Door build/libman build/LibMan; do
            if [ -f "$p" ]; then BIN="$p"; break; fi
          done

          if [ -z "$BIN" ]; then
            echo "DOOR binary not found."
            ls -la build
            exit 1
          fi

          cp "$BIN" dist/door

          [ -d scripts ]  && cp -R scripts  dist/ || true
          [ -d keywords ] && cp -R keywords dist/ || true
          [ -d icons ]    && cp -R icons    dist/ || true

          tar -czf door-linux.tar.gz dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-linux
          path: door-linux.tar.gz
          if-no-files-found: error

  # ============================================================
  # Ubuntu 24.04 portable bundle (Qt runtime shipped in artifact)
  # ============================================================

  build-ubuntu24:
    name: build-ubuntu24
    runs-on: ubuntu-24.04
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Install build / smoke-test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xvfb \
            libgl1-mesa-dev \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Configure (qmake)
        run: |
          mkdir -p build
          cd build
          qmake CONFIG+=release ../door.pro

      - name: Build
        run: |
          cd build
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j1 room_fetch
          make -j"$(nproc)"

      - name: Package Ubuntu 24 bundle
        env:
          BUNDLE_SKIP_LINUXDEPLOYQT: "1"
        run: |
          export QT_ROOT_DIR="$(qmake -query QT_INSTALL_PREFIX)"
          chmod +x scripts/package_linux_bundle.sh scripts/bundle_qt_libs_manual.sh
          bash scripts/package_linux_bundle.sh build door-ubuntu24.tar.gz "Ubuntu 24.04"

      - name: Smoke-test bundled binary (headless)
        run: |
          set -euxo pipefail
          tar -xzf door-ubuntu24.tar.gz
          test -x dist-bundle/door-run.sh
          if ! timeout 8s xvfb-run -a ./dist-bundle/door-run.sh -platform offscreen; then
            status=$?
            if [[ "${status}" -ne 124 ]]; then
              echo "Smoke test failed with exit ${status}" >&2
              exit "${status}"
            fi
          fi

      - name: Upload Ubuntu 24 artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-linux-ubuntu24
          path: door-ubuntu24.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Linux tests (stage 2, after build-linux)
  # ============================================================

  tests-linux:
    name: Tests
    needs: build-linux
    # Pin: ubuntu-latest drifted to 26.04 and breaks jurplel/install-qt-action apt.
    runs-on: ubuntu-24.04
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Configure tests
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake CONFIG+=debug ../tests/tests.pro

      - name: Build tests
        run: |
          cd build-tests
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j1 room_fetch
          make -j"$(nproc)"

      - name: Export Cap'n Proto runtime path
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/capnp-install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Make Linux test script executable
        run: chmod +x scripts/run_tests.sh

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          LIBMAN_TEST_DATA_DIR: ${{ github.workspace }}/tests/data
          LIBMAN_SKIP_COVERAGE: 1
        run: xvfb-run -a ./scripts/run_tests.sh

      - name: Upload test log
        uses: actions/upload-artifact@v4
        with:
          name: door-test-log-linux
          path: test_results.txt
          if-no-files-found: warn

  # ============================================================
  # Linux coverage (stage 3, after Tests)
  # ============================================================

  coverage-linux:
    name: Coverage (Ubuntu)
    needs: tests-linux
    runs-on: ubuntu-24.04
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            python3 \
            python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr

      - name: Configure tests (coverage enabled)
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake CONFIG+=debug CONFIG+=coverage ../tests/tests.pro

      - name: Build tests
        run: |
          cd build-tests
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j1 room_fetch
          make -j"$(nproc)"

      - name: Export Cap'n Proto runtime path
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/capnp-install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Make Linux test script executable
        run: chmod +x scripts/run_tests.sh

      - name: Run tests and generate coverage
        env:
          QT_QPA_PLATFORM: offscreen
          LIBMAN_TEST_DATA_DIR: ${{ github.workspace }}/tests/data
        run: xvfb-run -a ./scripts/run_tests.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: door-coverage-html
          path: |
            coverage.html
            coverage.*.html
            coverage.css
            coverage.js
          if-no-files-found: warn

  # ============================================================
  # Windows build (parallel with Linux chain)
  # ============================================================

  build-windows:
    runs-on: windows-latest
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install Qt (Qt 5.15.2 MinGW 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw81'

      - name: Prefer MinGW 64-bit on PATH
        shell: bash
        run: |
          # tools_mingw81 also ships mingw810_32; keep 64-bit ahead of it for qmake/cmake/make.
          if [ -d "${IQTA_TOOLS}/mingw810_64/bin" ]; then
            echo "${IQTA_TOOLS}/mingw810_64/bin" >> "$GITHUB_PATH"
          fi
          which g++ || true
          g++ -dumpmachine || true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes

      - name: Build Cap'n Proto
        shell: cmd
        run: |
          call scripts\mkcapnp.cmd
          if not exist capnp-install\include\capnp\message.h (
            echo ERROR: capnp headers missing after install
            exit /b 1
          )
          call scripts\mklstream.cmd
          if not exist capnp\schemas_built_stamp (
            echo ERROR: LStream schemas were not regenerated
            exit /b 1
          )

      - name: Configure (qmake)
        shell: bash
        run: |
          mkdir -p build
          cd build
          qmake CONFIG+=release "LIBMAN_ROOM_SOURCE_DIR=${LIBMAN_ROOM_SOURCE_DIR}" ../door.pro
          bash ../scripts/patch_capnp_makefile.sh

      - name: Build ROOM
        shell: cmd
        run: call scripts\fetch_room.cmd

      - name: Build (mingw32-make)
        shell: bash
        run: |
          cd build
          mingw32-make -j"$(nproc)"

      - name: Deploy Qt runtime and resources
        shell: cmd
        run: |
          cd build

          rmdir /s /q dist 2>nul
          mkdir dist

          if exist release\door.exe (
            copy release\door.exe dist\door.exe
          ) else if exist release\Door.exe (
            copy release\Door.exe dist\door.exe
          ) else if exist door.exe (
            copy door.exe dist\door.exe
          ) else if exist Door.exe (
            copy Door.exe dist\door.exe
          ) else (
            echo door.exe not found
            dir
            exit /b 1
          )

          windeployqt --dir dist dist\door.exe

          if exist ..\icons xcopy /E /I /Y ..\icons dist\icons

      - name: Build Windows installer
        shell: pwsh
        run: |
          if (!(Test-Path "installer\Door.iss")) {
            Write-Error "Missing installer\Door.iss"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\Door.iss" `
            /O"build\installer"

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          if (!(Test-Path "build\dist\door.exe")) {
            Write-Error "Missing build\dist\door.exe"
          }
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @(
            "flavor=windows"
            "created_at=$stamp"
            "source=door-windows"
          ) | Set-Content -Encoding ascii "build\dist\BUNDLE_SOURCE.txt"
          New-Item -ItemType Directory -Force -Path "build\portable" | Out-Null
          $zip = "build\portable\door-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Zip contents of dist/ so unpack yields door.exe + Qt next to it.
          Compress-Archive -Path "build\dist\*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Upload Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: door-windows
          path: build/portable/door-windows.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: door-windows-installer
          path: build/installer/*.exe
          if-no-files-found: error

  # ============================================================
  # RHEL 8 bundle (parallel with Linux chain / Windows)
  # ============================================================

  build-rhel8:
    name: Build RHEL 8 bundle
    runs-on: ubuntu-latest
    env:
      CORE_CHECKOUT_TOKEN: ${{ secrets.GH_PAT || secrets.LIBMAN_CORE_GIT_TOKEN }}
      LIBMAN_ROOM_SOURCE_DIR: ${{ github.workspace }}/.deps/Room
    container:
      image: rockylinux:8

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout ROOM (CommonDB)
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: .deps/Room
          token: ${{ env.CORE_CHECKOUT_TOKEN }}

      - name: Verify ROOM (CommonDB) checkout
        run: test -f .deps/Room/src/room_paths.h

      - name: Install build dependencies
        run: bash scripts/ci_deps_rhel8.sh

      - name: Install Qt
        run: bash scripts/ci_install_qt_rhel8.sh

      - name: Configure (qmake)
        run: |
          mkdir -p build
          cd build
          qmake CONFIG+=release ../door.pro

      - name: Build
        run: |
          cd build
          make -j1 capnp_install
          make -j1 lstream_schemas
          make -j1 room_fetch
          make -j"$(nproc)"

      - name: Install linuxdeployqt
        run: bash scripts/ci_install_linuxdeployqt.sh

      - name: Package RHEL 8 bundle
        run: |
          chmod +x scripts/package_linux_bundle.sh
          bash scripts/package_linux_bundle.sh build door-rhel8.tar.gz "RHEL 8.10 compatible"

      - name: Upload RHEL 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-rhel8
          path: door-rhel8.tar.gz
          if-no-files-found: error

  # ============================================================
  # Smoke-test scripts/install_room_stack_from_ci.sh
  # ============================================================

  test-stack-installer:
    name: test install_room_stack_from_ci.sh
    needs: [build-ubuntu24]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Offline self-test + syntax
        run: |
          chmod +x scripts/install_room_stack_from_ci.sh
          bash scripts/install_room_stack_from_ci.sh --self-test

      - name: Dry-run plan (ubuntu24 / door)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install_room_stack_from_ci.sh \
            --yes --force-ci --flavor ubuntu24 --tools door --dry-run

      - name: Download door-linux-ubuntu24 from this workflow
        uses: actions/download-artifact@v4
        with:
          name: door-linux-ubuntu24
          path: /tmp/door-ci-artifact

      - name: Install Door from local CI tar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAR="$(find /tmp/door-ci-artifact -type f \( -name '*.tar.gz' -o -name '*.tgz' \) | head -n1)"
          test -n "$TAR"
          echo "Using tar: $TAR"
          PREFIX=/tmp/room-stack
          bash scripts/install_room_stack_from_ci.sh \
            --yes --force-ci --flavor ubuntu24 --tools door \
            --prefix "$PREFIX" \
            --from-tar "$TAR"
          test -e "$PREFIX/bin/door"
          test -x "$(readlink -f "$PREFIX/bin/door")"
          echo "Installed door -> $(readlink -f "$PREFIX/bin/door")"
          ls -la "$PREFIX/lib/room-stack/door" | head
          test -f "$PREFIX/lib/room-stack/door/BUNDLE_SOURCE.txt"
          cat "$PREFIX/lib/room-stack/door/BUNDLE_SOURCE.txt"
          # Shared-prefix must keep siblings when a second tool dir is pre-seeded
          mkdir -p "$PREFIX/lib/room-stack/dummy-sibling"
          echo keep > "$PREFIX/lib/room-stack/dummy-sibling/marker"
          bash scripts/install_room_stack_from_ci.sh \
            --yes --force-ci --flavor ubuntu24 --tools door \
            --prefix "$PREFIX" \
            --from-tar "$TAR"
          test -f "$PREFIX/lib/room-stack/dummy-sibling/marker"
          test -e "$PREFIX/bin/door"
